<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile</title>
    <link rel="stylesheet" href="style.css" />
</head>

<body>
    <div class="container profile-container">
        <div class="profile-header">
            <div class="avatar" id="avatar"></div>
            <h2 id="userName">Loading...</h2>
            <p class="user-email" id="userEmail"></p>
        </div>

        <div class="profile-info">
            <div class="info-item">
                <span class="info-label">Account Created</span>
                <span class="info-value" id="createdAt">-</span>
            </div>
            <div class="info-item">
                <span class="info-label">Last Login</span>
                <span class="info-value" id="lastLogin">-</span>
            </div>
        </div>

        <div class="profile-actions">
            <button class="btn-logout" id="logoutBtn">Logout</button>
        </div>

        <div class="success" id="successMsg"></div>
    </div>

    <script>
        const CURRENT_USER_KEY = "currentUser";
        const USERS_KEY = "users";

        function getCurrentUser() {
            const user = localStorage.getItem(CURRENT_USER_KEY);
            return user ? JSON.parse(user) : null;
        }

        function clearCurrentUser() {
            localStorage.removeItem(CURRENT_USER_KEY);
        }

        function findUserById(id) {
            const users = localStorage.getItem(USERS_KEY);
            if (users) {
                const parsed = JSON.parse(users);
                return parsed.find(u => u.id === id);
            }
            return null;
        }

        function formatDate(isoString) {
            if (!isoString) return "-";
            const date = new Date(isoString);
            return date.toLocaleDateString("en-US", {
                year: "numeric",
                month: "long",
                day: "numeric",
                hour: "2-digit",
                minute: "2-digit"
            });
        }

        function checkAuth() {
            const currentUser = getCurrentUser();
            if (!currentUser) {
                window.location.href = "index.html";
                return null;
            }
            return currentUser;
        }

        function displayUserInfo(currentUser) {
            const fullUser = findUserById(currentUser.id);
            
            document.getElementById("userName").innerText = currentUser.name || "User";
            document.getElementById("userEmail").innerText = currentUser.email || "";
            
            const initial = currentUser.name ? currentUser.name.charAt(0).toUpperCase() : "U";
            document.getElementById("avatar").innerText = initial;
            
            if (fullUser) {
                document.getElementById("createdAt").innerText = formatDate(fullUser.createdAt);
            }
            
            document.getElementById("lastLogin").innerText = formatDate(currentUser.loginAt);
        }

        function logout() {
            clearCurrentUser();
            window.location.href = "index.html";
        }

        document.addEventListener("DOMContentLoaded", function () {
            const currentUser = checkAuth();
            if (currentUser) {
                displayUserInfo(currentUser);
            }

            document.getElementById("logoutBtn").addEventListener("click", logout);
        });
    </script>
</body>

</html>
